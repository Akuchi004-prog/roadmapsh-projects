<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <header>
        <p>Laibry Support</p>
        <p>Home</p>
        <p>Help</p>
        <p>Contact</p>
    </header>

    <hr>

    <main>
        <h1>Contact Us</h1>
        <p>Send us a message and we will get back to you.</p>

        <form>
            <div>
                <label for="name">Full Name: </label>
                <input type="text" id="name" name="Full Name" required>
            </div>

            <div>
                <label for="mail">Email: </label>
                <input type="email" id="mail" name="Email" required>
            </div>

            <div>
                <label for="subject">Subject: </label>
                <select id="subject" name="Subject" required>
                    <option value="" selected disabled>Select a subject</option>
                    <option value="support">Support</option>
                    <option value="sales">Sales</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <div>
                <label for="message">Message: </label>
                <textarea id="message" minlength="20" maxlength="300" required></textarea>
            </div>

            <fieldset>
                <legend>How do you hear about us?</legend>
                <div>
                    <input type="radio" id="search" name="source">
                    <label for="search">Search</label>

                <div>
                    <input type="radio" id="friend" name="source">
                    <label for="friend">Friend</label>
                </div>

                <div>
                    <input type="radio" id="social-media" name="source">
                    <label for="social-media">Social Media</label>
                </div>
            </fieldset>

            <div>
                <input type="checkbox" id="updates">
                <label for="updates">Send me product updates</label>
            </div>

            <div>
                <button type="submit" id="submit">Send Message</button>
            </div>
        </form>

        <hr>

        <footer>
            <p>&copy; 2026 Laibry Support</p>
        </footer>
    </main>
</body>
</html>
